name: Build AutoControl APK

on:
  workflow_dispatch:
  push:
    paths:
      - "app.zip"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract Android project
        run: unzip -o app.zip -d .

      - name: Configure Firebase
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$FIREBASE_CONFIG" ]; then
            echo "::error::Falta configurar el secreto FIREBASE_GOOGLE_SERVICES_JSON en Settings > Secrets and variables > Actions."
            exit 1
          fi
          mkdir -p app
          printf '%s' "$FIREBASE_CONFIG" > app/google-services.json

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: autocontrol-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
